# Сборка установщиков Axiom для Windows, macOS и Linux и публикация релиза здесь.
# Репозиторий публичный — раннеры GitHub для него бесплатны (в закрытом Ravva/Axiom минута macOS
# считается за 10). Исходники остаются закрытыми: сборка забирает их по токену SOURCE_TOKEN
# (Ravva/Axiom: Contents — чтение, Actions — запуск пересборки сайта) и в журнал не выводит.
# Секреты: SOURCE_TOKEN, TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# Запуск: пуш тега vX.Y.Z в Ravva/Axiom (его release.yml запускает этот workflow)
# или вручную: Actions → Build → Run workflow.
# - tag — тег в Ravva/Axiom; для пробной сборки можно ветку (main);
# - dry — пробная сборка: установщики в артефактах запуска, релиз не трогается;
# - platforms — что собрать (досборка одной платформы в тот же релиз);
# - mac_arm_runner — раннер для Apple Silicon: при «The job was not acquired by Runner»
#   на macos-latest — macos-15-intel (кросс-компиляция).
# Когда собраны все платформы, publish.yml проверяет черновик и публикует его (Latest).
name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег в Ravva/Axiom (v0.8.0); для пробной сборки — ветка"
        required: true
      dry:
        description: "Пробная сборка (артефакты, без релиза)"
        type: boolean
        default: false
      platforms:
        description: "Платформы"
        type: choice
        options: [all, windows, macos, macos-arm, macos-intel, linux]
        default: all
      mac_arm_runner:
        description: "Раннер для macOS Apple Silicon"
        default: macos-latest

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.tag }}-${{ inputs.dry }}
  cancel-in-progress: false

jobs:
  notes:
    if: ${{ !inputs.dry }}
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Ravva/Axiom
          ref: ${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
          sparse-checkout: .github/release-notes
      - name: Список изменений
        id: notes
        run: |
          bash .github/release-notes/compose.sh "${{ inputs.tag }}" > notes.md
          {
            echo "body<<AXIOM_NOTES_EOF"
            cat notes.md
            echo "AXIOM_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Ravva/Axiom
          ref: ${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Типы и сборка
        run: bun run build
      - name: Тесты интерфейса
        run: bun run test
      - name: Системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: checks
      - name: Тесты Rust
        working-directory: src-tauri
        run: cargo test --release --lib

  build:
    needs: [checks, notes]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm
            group: macos
            runner: ${{ inputs.mac_arm_runner }}
            target: aarch64-apple-darwin
          - name: macos-intel
            group: macos
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: windows
            group: windows
            runner: windows-latest
            target: ""
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Нужна ли эта платформа
        id: want
        shell: bash
        run: |
          p="${{ inputs.platforms }}"
          if [ "$p" = all ] || [ "$p" = "${{ matrix.name }}" ] || [ "$p" = "${{ matrix.group }}" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          else
            echo "Пропуск: platforms=$p"
          fi

      - uses: actions/checkout@v5
        if: steps.want.outputs.run
        with:
          repository: Ravva/Axiom
          ref: ${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: steps.want.outputs.run

      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.run
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        if: steps.want.outputs.run
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.runner }}-${{ matrix.target }}

      - name: Зависимости фронтенда
        if: steps.want.outputs.run
        run: bun install --frozen-lockfile

      - name: Пробная сборка
        if: steps.want.outputs.run && inputs.dry
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run && inputs.dry
        with:
          name: axiom-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          retention-days: 14

      - uses: tauri-apps/tauri-action@v0
        if: steps.want.outputs.run && !inputs.dry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Ravva
          repo: Axiom-releases
          releaseCommitish: main
          tagName: ${{ inputs.tag }}
          releaseName: Axiom ${{ inputs.tag }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Общая запись windows-x86_64 в latest.json — установщик NSIS (без прав администратора).
          updaterJsonPreferNsis: true
          tauriScript: bunx tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  # Linux — в контейнере ROSA 2021.1 (база МОС 12, glibc 2.33): собранное на Ubuntu 22.04
  # (glibc 2.35) на МОС 12 не запускается («GLIBC_2.34 not found»), это работает и там,
  # и на новых дистрибутивах.
  linux:
    needs: [checks, notes]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (inputs.platforms == 'all' || inputs.platforms == 'linux') }}
    runs-on: ubuntu-latest
    container: rosalab/rosa2021.1
    env:
      # linuxdeploy (сборка AppImage) сам AppImage, а FUSE в контейнере нет.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Системные библиотеки (ROSA)
        run: |
          dnf -y -q install git curl unzip tar xz file xdg-utils patchelf gcc gcc-c++ make pkgconf \
            lib64webkit2gtk4.1-devel lib64gtk+3.0-devel lib64rsvg2-devel lib64soup-3.0-devel
          rpm -q glibc

      - uses: actions/checkout@v5
        with:
          repository: Ravva/Axiom
          ref: ${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: rosa2021.1

      - name: Зависимости фронтенда
        run: bun install --frozen-lockfile

      - name: Пробная сборка
        if: inputs.dry
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bunx tauri build
          echo "Нужна glibc не новее: $(objdump -T src-tauri/target/release/axiom-app | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"

      - uses: actions/upload-artifact@v4
        if: inputs.dry
        with:
          name: axiom-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 14

      - uses: tauri-apps/tauri-action@v0
        if: ${{ !inputs.dry }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Ravva
          repo: Axiom-releases
          releaseCommitish: main
          tagName: ${{ inputs.tag }}
          releaseName: Axiom ${{ inputs.tag }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: bunx tauri

  publish:
    needs: [build, linux]
    if: ${{ !cancelled() && !inputs.dry && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
